name: Web prototype
run-name: Web prototype · ${{ github.ref_name }} · ${{ github.run_number }}
on:
  push:
    branches: ['work/web-prototype']
    paths: ['Web/**', 'Shared/**', '.github/workflows/web-prototype.yml', '.github/build-target.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      release_url: ${{ steps.release.outputs.release_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Pillow and pinned official Blender
        run: |
          python3 -m pip install Pillow==11.1.0
          python3 Web/install_blender.py
      - name: Install pinned Godot and Web templates
        run: python3 -c "import sys;sys.path.insert(0,'Web');import build;build.install()"
      - name: Validate the canonical content and unchanged native game
        run: |
          python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
          python3 tools/ci/check_content.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools/ci')
          import build_windows as c
          editor=c.OUT/'tools/editor/Godot_v4.5.1-stable_linux.x86_64'
          c.run([editor,'--headless','--editor','--path',c.ROOT/'Source','--import'],'native-import')
          c.run([editor,'--headless','--path',c.ROOT/'Source','--audio-driver','Dummy','--','--qa'],'native-gameplay',required=c.MARKERS)
          PY
          python3 Web/check_source.py --godot builds/tools/editor/Godot_v4.5.1-stable_linux.x86_64
      - name: Build isolated prototype and exercise real HTTP loader
        run: |
          python3 Web/build.py --blender builds/tools/blender-4.3.2-linux-x64/blender
          python3 Web/check_package.py
          git diff --exit-code -- Source
      - name: Publish versioned test archive
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Web/publish.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web-dist
      - name: Keep source proof, model measurements and diagnostic logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: web-prototype-diagnostics
          path: |
            builds/logs/
            builds/web-source-proof.json
            builds/web-models/model-report.json
          retention-days: 7
  pages:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages if permitted by repository settings
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish verified prototype
        id: deployment
        uses: actions/deploy-pages@v4
