name: Windows preview
run-name: Windows check · ${{ github.ref_name }} · ${{ github.run_number }}

on:
  push:
    branches: [main, 'work/**']
    paths:
      - 'Source/**'
      - 'tools/ci/**'
      - '.github/build-target.json'
      - '.github/workflows/windows.yml'
      - 'Launch-Compatibility.cmd'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout exact source
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
          # Historical References filenames include ':' and cannot be checked out on Windows.
          # Cone mode also includes root files such as Launch-Compatibility.cmd.
          sparse-checkout: |
            Source
            tools
            docs
            .github
      - name: Validate target and content; test CI failure detection
        run: |
          python -m unittest discover -s tools/ci -p "test_*.py" -v
          python tools/ci/check_content.py
          python tools/ci/build_windows.py target
      - name: Install pinned Godot 4.5.1 and matching Windows template
        run: python tools/ci/build_windows.py install
      - name: Import, run gameplay QA, export and check Windows executable
        run: python tools/ci/build_windows.py build
      - name: Publish versioned preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/publish_preview.py
      - name: Record failed attempt for the next chat
        if: failure() && steps.checkout.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/publish_preview.py failed
      - name: Keep diagnostic logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5, Node 24
        with:
          name: windows-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: builds/logs/
          if-no-files-found: ignore
          retention-days: 7
