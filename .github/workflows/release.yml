name: Accepted Windows release

on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accepted-windows-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - name: Publish the accepted ZIP without rebuilding it
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/promote_release.py
